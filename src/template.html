<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{metaDescription}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800;900&family=Inter:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <div class="site-header__inner content-gutter">
      <a class="site-header__brand" href="#about">{{name}}</a>
      <nav class="site-nav" aria-label="Sections">
        <ul class="site-nav__list">
          <li><a href="#about">About</a></li>
          <li><a href="#professional-experience">Experience</a></li>
          <li><a href="#academic-experience">Education</a></li>
          <li><a href="#certifications">Certifications</a></li>
          <li><a href="#tools">Tools &amp; Games</a></li>
          <li><a href="#languages">Languages</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main">
{{sections}}
  </main>
  <footer class="site-footer content-gutter">
    <p class="copy copy--small copy--muted">© {{year}} {{name}}</p>
    <a class="button" href="#top">Back to top</a>
  </footer>
</body>
</html>
